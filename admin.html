<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة شبكة وادي تبن نت</title><style>*{box-sizing:border-box}body{margin:0;background:#07172d;color:#f4f8ff;font-family:Tahoma}.wrap{max-width:1150px;margin:auto;padding:16px}.panel,.stat{background:#102947;border:1px solid #284866;border-radius:16px;padding:16px;margin:12px 0}button,input,select,textarea{background:#071a30;color:white;border:1px solid #31516f;border-radius:10px;padding:11px;margin:5px}button{background:#1977ef;border:0;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}table{width:100%;border-collapse:collapse}td,th{text-align:right;padding:9px;border-bottom:1px solid #31516f}.muted{color:#9db2c9}@media(max-width:700px){.wrap{padding:10px;width:100%}h1{font-size:22px}.panel,.stat{padding:13px;margin:9px 0}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.row{display:grid;grid-template-columns:1fr 1fr}input,select,textarea,button{max-width:100%;min-width:0;font-size:15px}table{min-width:560px}td,th{font-size:12px;padding:7px}.panel h2{font-size:18px}#codes{min-height:150px}}@media(max-width:380px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}}</style><main class="wrap"><h1>لوحة مدير شبكة وادي تبن نت</h1><p id="msg" class="muted"></p><section class="grid"><div class="stat">طلبات التسجيل <b id="requests">—</b></div><div class="stat">الحسابات <b id="users">—</b></div><div class="stat">الباقات <b id="packages">—</b></div><div class="stat">الكروت <b id="cards">—</b></div></section><section class="panel"><h2>طلبات التسجيل</h2><div id="req"></div></section><section class="panel"><h2>إنشاء حساب عميل أو تاجر</h2><form id="user" class="grid"><input name="name" placeholder="الاسم" required><input name="phone" placeholder="الجوال"><input name="username" placeholder="اسم المستخدم" required><input name="password" placeholder="كلمة المرور" required><select name="role"><option value="customer">عميل</option><option value="merchant">تاجر</option></select><input name="balance" type="number" min="0" placeholder="الرصيد الابتدائي"><button>إنشاء الحساب</button></form></section><section class="panel"><h2>إضافة باقة</h2><form id="pkg" class="grid"><input name="name" placeholder="اسم الباقة" required><input name="customerPrice" type="number" placeholder="سعر العميل" required><input name="merchantPrice" type="number" placeholder="سعر التاجر" required><button>حفظ الباقة</button></form></section><section class="panel"><h2>إضافة كروت للمخزون</h2><p class="muted">اختر الباقة ثم ألصق الأكواد أو ارفع PDF. راجع الأكواد قبل الإضافة.</p><select id="pack"></select><textarea id="codes" rows="5" style="width:100%" placeholder="كل كرت في سطر مستقل"></textarea><p class="muted">استيراد PDF غير مفعّل حالياً؛ أضف الأكواد كنص بعد مراجعتها.</p><button id="addstock">إضافة الأكواد</button></section><section class="panel"><h2>الحسابات</h2><div id="accounts"></div></section><section class="panel"><h2>سجل الحركات</h2><div id="logs"></div></section></main><script>const $=s=>document.querySelector(s),msg=s=>$('#msg').textContent=s;async function api(action,data={}){let r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(action==='admin-action'?{action,operation:data.action,...Object.fromEntries(Object.entries(data).filter(([k])=>k!=='action'))}:{action,...data})});let j=await r.json();if(!r.ok)throw Error(j.error||'فشلت العملية');return j}function table(rows,cols){return '<div style="overflow:auto"><table><tr>'+cols.map(c=>'<th>'+c[1]+'</th>').join('')+'</tr>'+rows.map(x=>'<tr>'+cols.map(c=>'<td>'+(x[c[0]]??'—')+'</td>').join('')+'</tr>').join('')+'</table></div>'}async function load(){try{let d=await api('admin-data');let s=d.state||d;let req=s.requests||[];$('#requests').textContent=req.filter(x=>x.status==='pending').length;$('#users').textContent=(s.users||[]).length;$('#packages').textContent=(s.packages||[]).length;$('#cards').textContent=(s.cards||[]).filter(x=>x.status==='available').length;$('#req').innerHTML=req.map(x=>'<div class="panel"><b>'+x.name+'</b> — '+x.username+' — '+x.phone+'<p>'+x.status+'</p><button onclick="act(\'approve\',\''+x.id+'\')">موافقة وتفعيل</button><button onclick="act(\'reject\',\''+x.id+'\')">رفض</button></div>').join('')||'لا توجد طلبات';$('#accounts').innerHTML=table(s.users||[],[['name','الاسم'],['username','المستخدم'],['role','النوع'],['balance','الرصيد'],['status','الحالة']]);$('#logs').innerHTML=table(s.transactions||[],[['type','العملية'],['username','الحساب'],['amount','المبلغ'],['createdAt','التاريخ']]);$('#pack').innerHTML=(s.packages||[]).map(p=>'<option value="'+p.id+'">'+p.name+'</option>').join('')}catch(e){msg(e.message)}}window.act=async(a,id)=>{try{await api('admin-action',{action:a,id});msg('تمت العملية');load()}catch(e){msg(e.message)}};$('#user').onsubmit=async e=>{e.preventDefault();try{await api('admin-action',{action:'create-user',...Object.fromEntries(new FormData(e.target))});e.target.reset();load()}catch(x){msg(x.message)}};$('#pkg').onsubmit=async e=>{e.preventDefault();try{await api('admin-action',{action:'package-create',...Object.fromEntries(new FormData(e.target))});e.target.reset();load()}catch(x){msg(x.message)}};$('#addstock').onclick=async()=>{try{let codes=$('#codes').value;if(!codes.trim())return;await api('admin-action',{action:'stock-add',packageId:$('#pack').value,codes});$('#codes').value='';msg('تمت إضافة الكروت');load()}catch(e){msg(e.message)}};load();</script></html>
