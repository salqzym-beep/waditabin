<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة شبكة وادي تبن نت</title><style>*{box-sizing:border-box}body{margin:0;background:#07172d;color:#f4f8ff;font-family:Tahoma}.wrap{max-width:1150px;margin:auto;padding:16px}.panel,.stat{background:#102947;border:1px solid #284866;border-radius:16px;padding:16px;margin:12px 0}button,input,select,textarea{background:#071a30;color:white;border:1px solid #31516f;border-radius:10px;padding:11px;margin:5px}button{background:#1977ef;border:0;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}table{width:100%;border-collapse:collapse}td,th{text-align:right;padding:9px;border-bottom:1px solid #31516f}.muted{color:#9db2c9}@media(max-width:700px){.wrap{padding:10px;width:100%}h1{font-size:22px}.panel,.stat{padding:13px;margin:9px 0}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.row{display:grid;grid-template-columns:1fr 1fr}input,select,textarea,button{max-width:100%;min-width:0;font-size:15px}table{min-width:560px}td,th{font-size:12px;padding:7px}.panel h2{font-size:18px}#codes{min-height:150px}}@media(max-width:380px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}}</style><main class="wrap"><h1>لوحة مدير شبكة وادي تبن نت</h1><p id="msg" class="muted"></p><section id="credentials" class="panel" hidden></section><section id="loginBox" class="panel"><h2>تسجيل دخول المدير</h2><form id="loginForm" class="grid"><input name="username" autocomplete="username" placeholder="اسم المستخدم" required><input name="password" type="password" autocomplete="current-password" placeholder="كلمة مرور المدير" required><button>دخول لوحة المدير</button></form></section><section id="dashboard" hidden><section class="grid"><div class="stat">طلبات التسجيل <b id="requests">—</b></div><div class="stat">الحسابات <b id="users">—</b></div><div class="stat">الباقات <b id="packages">—</b></div><div class="stat">الكروت <b id="cards">—</b></div></section><section class="panel"><h2>طلبات التسجيل</h2><div id="req"></div></section><section class="panel"><h2>إنشاء حساب عميل أو تاجر</h2><form id="user" class="grid"><input name="name" placeholder="الاسم" required><input name="phone" placeholder="الجوال"><input name="username" placeholder="اسم المستخدم" required><input name="password" placeholder="كلمة المرور" required><select name="role"><option value="customer">عميل</option><option value="merchant">تاجر</option></select><input name="balance" type="number" min="0" placeholder="الرصيد الابتدائي"><button>إنشاء الحساب</button></form></section><section class="panel"><h2>إضافة باقة</h2><form id="pkg" class="grid"><input name="name" placeholder="اسم الباقة" required><input name="customerPrice" type="number" placeholder="سعر العميل" required><input name="merchantPrice" type="number" placeholder="سعر التاجر" required><button>حفظ الباقة</button></form></section><section class="panel"><h2>إضافة كروت للمخزون</h2><p class="muted">اختر الباقة ثم ألصق الأكواد أو ارفع PDF. راجع الأكواد قبل الإضافة.</p><select id="pack"></select><textarea id="codes" rows="5" style="width:100%" placeholder="كل كرت في سطر مستقل"></textarea><label>رفع ملف PDF للباقة المحددة <input id="pdfFile" type="file" accept="application/pdf,.pdf"></label><button id="readpdf" type="button">استخراج الكروت ومعاينتها</button><div id="pdfPreview"></div><button id="confirmPdf" type="button" hidden>اعتماد وإضافة الكروت للمخزون</button><button id="addstock" type="button">إضافة الأكواد المكتوبة</button></section><section class="panel"><h2>الحسابات</h2><div id="accounts"></div></section><section class="panel"><h2>سجل الحركات</h2><div id="logs"></div></section></section></main><script>const $=s=>document.querySelector(s),msg=s=>$('#msg').textContent=s;async function api(action,data={},attempt=0){let payload=action==='admin-action'?{action,operation:data.action,...Object.fromEntries(Object.entries(data).filter(([k])=>k!=='action'))}:{action,...data};let r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});let j=await r.json();if(!r.ok&&r.status===409&&j.code==='CONCURRENT_UPDATE'&&attempt<2)return api(action,data,attempt+1);if(!r.ok)throw Error(j.error||'فشلت العملية');return j}function table(rows,cols){return '<div style="overflow:auto"><table><tr>'+cols.map(c=>'<th>'+c[1]+'</th>').join('')+'</tr>'+rows.map(x=>'<tr>'+cols.map(c=>'<td>'+esc(x[c[0]])+'</td>').join('')+'</tr>').join('')+'</table></div>'}function esc(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
async function load(){try{
 let d=await api('admin-data');let s=d.state||d;let req=s.requests||[],pending=req.filter(x=>x.status==='pending');
 $('#requests').textContent=pending.length;$('#users').textContent=(s.users||[]).length;$('#packages').textContent=(s.packages||[]).length;$('#cards').textContent=(s.cards||[]).filter(x=>x.status==='available').length;
 $('#req').innerHTML=pending.map(x=>'<div class="panel"><h3>'+esc(x.name)+'</h3><p>رقم الجوال: <b>'+esc(x.phone)+'</b><br>اسم المستخدم: <b>'+esc(x.username)+'</b><br>نوع الحساب: '+(x.role==='merchant'?'تاجر':'عميل')+'<br>تاريخ الطلب: '+esc(x.createdAt||'—')+'</p><p class="muted">كلمة المرور الأصلية لا يمكن عرضها لأسباب أمنية. يمكنك تعيين كلمة مرور جديدة عند التفعيل.</p><div class="grid"><label>الرصيد عند التفعيل<input id="bal_'+esc(x.id)+'" type="number" min="0" step="any" value="0"></label><label>كلمة مرور جديدة (اختياري)<input id="pass_'+esc(x.id)+'" type="text" minlength="8" placeholder="كلمة مرور جديدة لتسليمها للعميل"></label></div><div class="row"><button onclick="approveRequest(\''+esc(x.id)+'\')">إضافة وتفعيل الحساب</button><button style="background:#8d3343" onclick="act(\'reject\',\''+esc(x.id)+'\')">رفض الطلب</button></div></div>').join('')||'<p>لا توجد طلبات معلّقة حالياً.</p>';
 $('#accounts').innerHTML=(s.users||[]).map(u=>'<div class="panel"><b>'+esc(u.name)+'</b> — '+esc(u.username)+'<div class="grid"><label>الاسم<input id="un_'+esc(u.id)+'" value="'+esc(u.name)+'"></label><label>الجوال<input id="up_'+esc(u.id)+'" value="'+esc(u.phone)+'"></label><label>اسم المستخدم<input id="uu_'+esc(u.id)+'" value="'+esc(u.username)+'"></label><label>الرصيد<input id="ub_'+esc(u.id)+'" type="number" min="0" step="any" value="'+esc(u.balance)+'"></label><label>النوع<select id="ur_'+esc(u.id)+'"><option value="customer" '+(u.role==='customer'?'selected':'')+'>عميل</option><option value="merchant" '+(u.role==='merchant'?'selected':'')+'>تاجر</option></select></label><label>الحالة<select id="us_'+esc(u.id)+'"><option value="active" '+(u.status==='active'?'selected':'')+'>نشط</option><option value="suspended" '+(u.status==='suspended'?'selected':'')+'>موقوف</option></select></label><label>تعيين كلمة مرور جديدة<input id="pw_'+esc(u.id)+'" type="text" placeholder="كلمة مرور جديدة — اتركها فارغة دون تغيير"></label></div><button onclick="saveUser(\''+esc(u.id)+'\')">حفظ تعديلات الحساب</button></div>').join('')||'لا توجد حسابات';
 $('#logs').innerHTML=table(s.transactions||[],[['type','العملية'],['username','الحساب'],['amount','المبلغ'],['createdAt','التاريخ']]);
 $('#pack').innerHTML=(s.packages||[]).map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>').join('');
 }catch(e){msg(e.message);if(String(e.message).includes('تسجيل الدخول')){ $('#dashboard').hidden=true; $('#loginBox').hidden=false; }}}
window.approveRequest=async(id,username)=>{try{const balance=Number($('#bal_'+id).value),newPassword=$('#pass_'+id).value;if(!Number.isFinite(balance)||balance<0)throw Error('أدخل رصيداً صحيحاً');if(newPassword.length<8)throw Error('اكتب كلمة مرور من 8 أحرف على الأقل');await api('admin-action',{action:'approve',id,balance,newPassword});$('#credentials').hidden=false;$('#credentials').innerHTML='<h3>بيانات الحساب الذي تم تفعيله — انسخها وسلمها للعميل الآن</h3><p>اسم المستخدم: <b>'+esc(username)+'</b></p><p>كلمة المرور: <b>'+esc(newPassword)+'</b></p><button type="button" id="copyCred">نسخ بيانات الدخول</button>';$('#copyCred').onclick=()=>navigator.clipboard.writeText('اسم المستخدم: '+username+'\\nكلمة المرور: '+newPassword);msg('تم تفعيل الحساب وإضافة الرصيد المحدد');await load()}catch(e){msg(e.message)}};
window.saveUser=async id=>{try{const pw=$('#pw_'+id).value,username=$('#uu_'+id).value;await api('admin-action',{action:'user-update',id,name:$('#un_'+id).value,phone:$('#up_'+id).value,username,balance:$('#ub_'+id).value,role:$('#ur_'+id).value,status:$('#us_'+id).value,newPassword:pw});msg(pw?'تم الحفظ. بيانات التسليم — اسم المستخدم: '+username+' | كلمة المرور الجديدة: '+pw+' (احفظها الآن)':'تم حفظ تعديلات الحساب');await load()}catch(e){msg(e.message)}};
window.act=async(a,id)=>{try{await api('admin-action',{action:a,id});msg(a==='reject'?'تم رفض الطلب':'تمت العملية');await load()}catch(e){msg(e.message)}};
$('#user').onsubmit=async e=>{e.preventDefault();try{await api('admin-action',{action:'create-user',...Object.fromEntries(new FormData(e.target))});e.target.reset();load()}catch(x){msg(x.message)}};$('#pkg').onsubmit=async e=>{e.preventDefault();try{await api('admin-action',{action:'package-create',...Object.fromEntries(new FormData(e.target))});e.target.reset();load()}catch(x){msg(x.message)}};$('#addstock').onclick=async()=>{try{let codes=$('#codes').value;if(!codes.trim())return;const r=await api('admin-action',{action:'stock-add',packageId:$('#pack').value,codes});$('#codes').value='';msg('تمت إضافة '+r.added+' كرت إلى باقة '+r.packageName+'، والمكرر: '+r.duplicates);await load()}catch(e){msg(e.message)}};load();
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{const data=Object.fromEntries(new FormData(e.target));await api('login',data);$('#loginBox').hidden=true;$('#dashboard').hidden=false;msg('تم تسجيل الدخول');await load()}catch(x){msg(x.message)}};
async function boot(){try{await load();$('#loginBox').hidden=true;$('#dashboard').hidden=false}catch(e){$('#dashboard').hidden=true;$('#loginBox').hidden=false;msg('يرجى تسجيل الدخول')} }
boot();

let pdfExtracted=[];
$('#readpdf').onclick=async()=>{try{const file=$('#pdfFile').files[0];if(!file)throw Error('اختر ملف PDF أولاً');if(file.size>5*1024*1024)throw Error('الحد الأقصى لحجم PDF هو 5MB');const b64=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(file)});const result=await api('admin-action',{action:'stock-pdf-import',packageId:$('#pack').value,pdfBase64:b64});pdfExtracted=result.codes||[];$('#pdfPreview').innerHTML='<p>الباقة: '+esc(result.packageName)+' | المستخرج: '+result.total+' | المكرر: '+result.duplicates+' | الجديد: '+pdfExtracted.length+'</p><textarea id="pdfCodes" rows="8" style="width:100%">'+esc(pdfExtracted.join('\n'))+'</textarea><p class="muted">راجع الأكواد ويمكنك تعديلها قبل الاعتماد.</p>';$('#confirmPdf').hidden=!pdfExtracted.length;msg('استخراج PDF: '+result.total+' كرت، المكرر: '+result.duplicates+'، الجديد: '+pdfExtracted.length+'. راجع القائمة قبل الاعتماد.')}catch(e){msg(e.message)}};
$('#confirmPdf').onclick=async()=>{try{const codes=$('#pdfCodes').value.split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean);const r=await api('admin-action',{action:'stock-pdf-confirm',packageId:$('#pack').value,codes});pdfExtracted=[];$('#pdfPreview').textContent='';$('#confirmPdf').hidden=true;$('#pdfFile').value='';msg('تمت إضافة '+r.added+' كرت من PDF إلى باقة '+r.packageName+'، والمكرر '+r.duplicates);await load()}catch(e){msg(e.message)}};
</script></html>
