<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة التاجر - وادي تبن نت</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07172d;color:#f4f8ff;font-family:Tahoma,Arial}.wrap{max-width:850px;margin:auto;padding:16px}.panel{background:#102947;border:1px solid #284866;border-radius:16px;padding:18px;margin:12px 0}button,input,select{background:#071a30;color:white;border:1px solid #31516f;border-radius:10px;padding:12px;margin:5px;font:inherit}button{background:#1977ef;border:0;cursor:pointer}.balance{font-size:32px;color:#73e1e7}.muted{color:#9db2c9}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid input,.grid select{width:calc(100% - 10px)}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions a{color:#7de3ed}#logout{display:block;text-align:center;margin:22px;color:#d7a4ff;text-decoration:none;padding:12px}small{color:#9db2c9}@media(max-width:560px){.grid{grid-template-columns:1fr}.wrap{padding:10px}}
</style>
<main class="wrap">
<h1>لوحة التاجر — شبكة وادي تبن نت</h1>
<section class="panel"><p>رصيدك المتبقي في المحفظة</p><b id="balance" class="balance">—</b><p id="name" class="muted"></p></section>
<section class="panel"><h2>شحن عميل وإصدار كرت</h2><p class="muted">أدخل اسم العميل ورقم جواله واختر الباقة. يتم خصم سعر التاجر بعد نجاح إصدار الكرت فقط.</p>
<form id="saleForm" class="grid"><input name="customerName" placeholder="اسم العميل" required><input name="phone" type="tel" placeholder="رقم جوال العميل" required><select id="merchantPackage" name="packageId" required><option value="">تحميل الباقات...</option></select><button type="submit">شحن وإصدار الكرت</button></form><div id="saleResult"></div></section>
<section class="panel"><h2>الكروت التي أصدرتها</h2><div id="cards">جارٍ تحميل الكروت...</div></section>
<section class="panel"><h2>سجل مبيعاتي وحركات الرصيد</h2><div id="merchantLogs">جارٍ تحميل الحركات...</div></section>
<a id="logout" href="/api?action=logout">تسجيل الخروج</a><p id="msg" role="status"></p></main>
<script>
async function api(action,data={}){const r=await fetch('/api',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...data})});let j;try{j=await r.json()}catch{throw Error('تعذر قراءة رد الخادم')}if(!r.ok)throw Error(j.error||'فشلت العملية');return j}
const $=s=>document.querySelector(s);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function message(t){$('#msg').textContent=t}
function renderLogs(transactions){const rows=(transactions||[]).slice().sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));$('#merchantLogs').innerHTML=rows.map(t=>'<article class="panel"><b>'+esc(t.type==='merchant-sale'?'بيع كرت':t.type==='balance-credit'?'إضافة رصيد':t.type==='balance-debit'?'خصم رصيد':t.type)+'</b><p>المبلغ: '+esc(t.amount)+' | الرصيد بعد العملية: '+esc(t.balanceAfter??'—')+'</p><p>'+[t.customerName,t.phone,t.packageName,t.cardCode,t.note].filter(Boolean).map(esc).join(' — ')+'</p><small>'+esc(t.createdAt||'')+'</small></article>').join('')||'<p>لا توجد حركات مسجلة حتى الآن.</p>'}
async function load(){try{const d=await api('portal-data');const s=d.state||{};const u=d.user||s.user||{};$('#balance').textContent=u.balance??'0';$('#name').textContent=(u.name||u.username||'')+' — '+(u.username||'');const packages=(s.packages||[]).filter(p=>p.active!==false);$('#merchantPackage').innerHTML='<option value="">اختر الباقة</option>'+packages.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+' — سعر التاجر '+esc(p.merchantPrice)+' / سعر العميل '+esc(p.customerPrice)+'</option>').join('');$('#cards').innerHTML=(s.cards||[]).map(c=>{const p=packages.find(x=>x.id===c.packageId);return '<article class="panel"><b>الكرت: '+esc(c.code)+'</b><p>الباقة: '+esc(p?.name||c.packageName||'—')+'</p><p>العميل: '+esc(c.customerName||'—')+' | الجوال: '+esc(c.customerPhone||'—')+'</p><small>تاريخ الإصدار: '+esc(c.soldAt||'—')+'</small></article>'}).join('')||'<p>لم تصدر كروت بعد.</p>';renderLogs(s.transactions||[]);if(d.isMerchant!==true&&u.role!=='merchant'){message('هذا الحساب غير مسجل كتاجر في النظام.');$('#saleForm button').disabled=true}}catch(e){message(e.message+' — حدّث الصفحة، وإذا استمرت المشكلة أرسل صورة رسالة الخطأ.');$('#balance').textContent='—';$('#cards').textContent='تعذر تحميل البيانات';$('#merchantLogs').textContent='تعذر تحميل الحركات'}}
$('#saleForm').addEventListener('submit',async e=>{e.preventDefault();message('جارٍ تنفيذ عملية الشحن...');const btn=e.currentTarget.querySelector('button');btn.disabled=true;try{const data=Object.fromEntries(new FormData(e.currentTarget));const r=await api('merchant-sale',data);const phone=(r.phone||'').replace(/[^0-9]/g,'');const text='شبكة وادي تبن نت\nالعميل: '+r.customerName+'\nالباقة: '+r.packageName+'\nالكرت: '+r.card.code;$('#saleResult').innerHTML='<article class="panel"><h3>تم الشحن بنجاح</h3><p>العميل: '+esc(r.customerName)+'</p><p>الجوال: '+esc(r.phone)+'</p><p>الباقة: '+esc(r.packageName)+'</p><p>الكرت: <b>'+esc(r.card.code)+'</b></p><p>الخصم: '+esc(r.merchantCost)+' | الربح: '+esc(r.profit)+'</p><p>الرصيد المتبقي: <b>'+esc(r.balance)+'</b></p><div class="actions"><a target="_blank" rel="noopener" href="https://wa.me/'+phone+'?text='+encodeURIComponent(text)+'">إرسال واتساب</a><a href="sms:'+phone+'?body='+encodeURIComponent(text)+'">إرسال SMS</a></div></article>';e.currentTarget.reset();await load();message('اكتملت عملية البيع وتم تحديث الرصيد والسجل')}catch(x){message(x.message)}finally{btn.disabled=false}});
load();
</script>
</html>
