<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حسابي - وادي تبن نت</title><style>*{box-sizing:border-box}body{margin:0;background:#07172d;color:#f4f8ff;font-family:Tahoma}.wrap{max-width:850px;margin:auto;padding:16px}.panel{background:#102947;border:1px solid #284866;border-radius:16px;padding:18px;margin:12px 0}button,select{background:#1977ef;color:white;border:0;border-radius:10px;padding:12px;margin:5px}#balance{font-size:32px;color:#73e1e7}</style><main class="wrap"><h1>حسابي — شبكة وادي تبن نت</h1><section class="panel"><p>رصيد المحفظة</p><b id="balance">—</b><p id="name"></p></section><section id="customerPanel" class="panel"><h2>شراء كرت</h2><select id="package"></select><button id="buy">شراء من المحفظة</button></section><section class="panel"><h2>كروتي</h2><div id="cards"></div></section><section class="panel"><h2>سجل الحركات</h2><div id="logs"></div></section><section id="merchantPanel" class="panel" hidden><h2>لوحة التاجر — شحن عميل</h2><p>اكتب بيانات العميل واختر الباقة، وسيتم خصم سعر التاجر من رصيدك بعد نجاح العملية فقط.</p><form id="saleForm"><input name="customerName" placeholder="اسم العميل" required><input name="phone" placeholder="رقم جوال العميل" required><select id="merchantPackage" name="packageId" required></select><button>شحن وإصدار الكرت</button></form><div id="saleResult"></div><h3>سجل مبيعاتي</h3><div id="merchantLogs"></div></section><button id="logout" type="button">تسجيل الخروج</button><p id="msg"></p></main><script>async function api(action,data={}){let r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...data})});let j=await r.json();if(!r.ok)throw Error(j.error||'فشلت العملية');return j}async function load(){try{let d=await api('portal-data');let s=d.state||d,u=d.user||s.user;document.querySelector('#balance').textContent=u.balance??0;document.querySelector('#name').textContent=u.name||u.username;document.querySelector('#package').innerHTML=(s.packages||[]).filter(p=>p.active!==false).map(p=>'<option value="'+p.id+'">'+p.name+' — '+p.customerPrice+'</option>').join('');if(u.role==='merchant'){document.querySelector('#customerPanel').hidden=true;document.querySelector('#merchantPanel').hidden=false;document.querySelector('#merchantPackage').innerHTML=(s.packages||[]).filter(p=>p.active!==false).map(p=>'<option value="'+p.id+'">'+p.name+' — سعر التاجر '+p.merchantPrice+' / سعر العميل '+p.customerPrice+'</option>').join('');document.querySelector('#merchantLogs').innerHTML=(s.transactions||[]).filter(t=>t.type==='merchant-sale').map(t=>'<p>'+t.customerName+' — '+t.phone+' — '+t.packageName+' — '+t.amount+' — '+t.createdAt+'</p>').join('')||'لا توجد مبيعات بعد'}else{document.querySelector('#customerPanel').hidden=false;document.querySelector('#merchantPanel').hidden=true;}document.querySelector('#cards').innerHTML=(s.cards||[]).map(card=>{const p=(s.packages||[]).find(x=>x.id===card.packageId);return '<div class="panel"><b>'+card.code+'</b><p>الباقة: '+(p?.name||'—')+' | الحالة: '+(card.status==='available'?'متاح':'مسحوب')+'</p><button onclick="navigator.clipboard.writeText(\\''+card.code+'\\')">نسخ الكرت</button></div>'}).join('')||'لا توجد كروت';document.querySelector('#logs').innerHTML=(s.transactions||[]).slice().sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt))).map(t=>'<div class="panel"><b>'+t.type+'</b><p>المبلغ: '+t.amount+' | الرصيد بعد الحركة: '+(t.balanceAfter??'—')+'</p><p>'+[t.note,t.packageName,t.cardCode,t.customerName,t.phone].filter(Boolean).join(' — ')+'</p><small>'+t.createdAt+'</small></div>').join('')||'لا توجد حركات'}catch(e){document.querySelector('#msg').textContent=e.message}}document.querySelector('#saleForm').onsubmit=async e=>{e.preventDefault();try{const data=Object.fromEntries(new FormData(e.target));const result=await api('merchant-sale',data);const smsText='شبكة وادي تبن نت\\nالعميل: '+result.customerName+'\\nالباقة: '+result.packageName+'\\nالكرت: '+result.card.code;const phoneDigits=result.phone.replace(/[^0-9]/g,'');const message='شبكة وادي تبن نت%0Aالعميل: '+encodeURIComponent(result.customerName)+'%0Aالباقة: '+encodeURIComponent(result.packageName)+'%0Aالكرت: '+encodeURIComponent(result.card.code);document.querySelector('#saleResult').innerHTML='<h3>تم الشحن بنجاح</h3><p>اسم العميل: '+result.customerName+'</p><p>رقم الجوال: '+result.phone+'</p><p>الباقة: '+result.packageName+'</p><p>الكرت: <b>'+result.card.code+'</b></p><p>الخصم من رصيدك: '+result.merchantCost+' | ربحك: '+result.profit+'</p><div style="display:flex;gap:8px;flex-wrap:wrap"><a style="color:#7de3ed" target="_blank" href="https://wa.me/'+phoneDigits+'?text='+message+'">مشاركة تفاصيل الكرت عبر واتساب</a><a style="color:#7de3ed" href="sms:'+phoneDigits+'?body='+encodeURIComponent(smsText)+'">إرسال رسالة SMS</a></div>';e.target.reset();await load()}catch(x){document.querySelector('#msg').textContent=x.message}};document.querySelector('#buy').onclick=async()=>{try{let j=await api('purchase',{packageId:document.querySelector('#package').value});document.querySelector('#msg').textContent='تم الشراء: '+(j.card?.code||'');load()}catch(e){document.querySelector('#msg').textContent=e.message}};document.querySelector('#logout').addEventListener('click',async()=>{const b=document.querySelector('#logout');b.disabled=true;b.textContent='جارٍ تسجيل الخروج...';try{const r=await fetch('/api',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'logout'})});if(!r.ok)throw new Error('تعذر إنهاء الجلسة');}catch(e){document.querySelector('#msg').textContent='تعذر الاتصال بالخادم؛ حاول مرة أخرى';b.disabled=false;b.textContent='تسجيل الخروج';return;}location.replace('/');});load()</script></html>
