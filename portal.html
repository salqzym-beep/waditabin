<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حسابي - وادي تبن نت</title><style>*{box-sizing:border-box}body{margin:0;background:#07172d;color:#f4f8ff;font-family:Tahoma}.wrap{max-width:850px;margin:auto;padding:16px}.panel{background:#102947;border:1px solid #284866;border-radius:16px;padding:18px;margin:12px 0}button,select{background:#1977ef;color:white;border:0;border-radius:10px;padding:12px;margin:5px}#balance{font-size:32px;color:#73e1e7}</style><main class="wrap"><h1>حسابي — شبكة وادي تبن نت</h1><section class="panel"><p>رصيد المحفظة</p><b id="balance">—</b><p id="name"></p></section><section class="panel"><h2>شراء كرت</h2><select id="package"></select><button id="buy">شراء من المحفظة</button></section><section class="panel"><h2>كروتي</h2><div id="cards"></div></section><section class="panel"><h2>سجل الحركات</h2><div id="logs"></div></section><button id="logout">تسجيل الخروج</button><p id="msg"></p></main><script>async function api(action,data={}){let r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...data})});let j=await r.json();if(!r.ok)throw Error(j.error||'فشلت العملية');return j}async function load(){try{let d=await api('portal-data');let s=d.state||d,u=d.user||s.user;document.querySelector('#balance').textContent=u.balance??0;document.querySelector('#name').textContent=u.name||u.username;document.querySelector('#package').innerHTML=(s.packages||[]).filter(p=>p.active!==false).map(p=>'<option value="'+p.id+'">'+p.name+' — '+p.customerPrice+'</option>').join('');document.querySelector('#cards').innerHTML=(s.cards||[]).map(c=>'<p>'+c.code+' <button onclick="navigator.clipboard.writeText(\''+c.code+'\')">نسخ</button></p>').join('')||'لا توجد كروت';document.querySelector('#logs').innerHTML=(s.transactions||[]).map(t=>'<p>'+t.type+' — '+t.amount+'</p>').join('')}catch(e){document.querySelector('#msg').textContent=e.message}}document.querySelector('#buy').onclick=async()=>{try{let j=await api('purchase',{packageId:document.querySelector('#package').value});document.querySelector('#msg').textContent='تم الشراء: '+(j.card?.code||'');load()}catch(e){document.querySelector('#msg').textContent=e.message}};document.querySelector('#logout').onclick=async()=>{await api('logout');location.href='/'};load()</script></html>
