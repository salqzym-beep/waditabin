<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شبكة وادي تبن نت</title><style>*{box-sizing:border-box}body{margin:0;background:#07172d;color:#f4f8ff;font-family:Tahoma,Arial}.wrap{max-width:520px;margin:7vh auto;padding:18px}.card{background:#102947;border:1px solid #284866;border-radius:20px;padding:24px;box-shadow:0 16px 45px #0005}h1{font-size:25px;margin:0 0 8px;color:#75d9e7}p{color:#a9c1d2;line-height:1.8}input,select,button{width:100%;padding:13px;margin:7px 0;border-radius:11px;border:1px solid #31516f;background:#071a30;color:white;font-size:16px}button{background:linear-gradient(110deg,#1977ef,#13aeb8);border:0;font-weight:bold;cursor:pointer}.muted{font-size:13px;color:#91aabc}a{color:#8de5ed}</style><main class="wrap"><section class="card"><h1>شبكة وادي تبن نت</h1><p>بوابة دخول التجار</p><section id="loginAd" hidden style="margin:16px 0 20px;padding:14px;border:1px solid #31516f;border-radius:14px;background:#0a2038;text-align:center"><img id="adImage" hidden alt="إعلان" style="display:block;width:100%;max-height:240px;object-fit:contain;border-radius:10px;margin:0 auto 10px"><p id="adText" style="white-space:pre-wrap;margin:8px 0"></p><a id="adWhats" hidden target="_blank" rel="noopener" style="display:inline-block;background:#168b58;color:white;text-decoration:none;padding:11px 18px;border-radius:10px;font-weight:bold">تواصل معنا عبر واتساب</a></section><section id="loginAd" hidden style="margin:16px 0 20px;padding:14px;border:1px solid #31516f;border-radius:14px;background:#0a2038;text-align:center"><img id="adImage" hidden alt="إعلان" style="display:block;width:100%;max-height:240px;object-fit:contain;border-radius:10px;margin:0 auto 10px"><p id="adText" style="white-space:pre-wrap;margin:8px 0"></p><a id="adWhats" hidden target="_blank" rel="noopener" style="display:inline-block;background:#168b58;color:white;text-decoration:none;padding:11px 18px;border-radius:10px;font-weight:bold">تواصل معنا عبر واتساب</a></section><form id="login"><input name="username" placeholder="اسم المستخدم" required><input name="password" type="password" placeholder="كلمة المرور" required><button>دخول</button></form><p id="msg"></p></section></main><script>const msg=document.querySelector('#msg');async function post(action,data){let r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...data})});let j=await r.json();if(!r.ok)throw Error(j.error||'تعذر إتمام العملية');return j}async function loadLoginAd(){try{const r=await fetch('/api?action=login-ad');if(!r.ok)return;const a=await r.json();if(!a||(!a.text&&!a.imagePath&&!a.phone))return;const box=document.querySelector('#loginAd');box.hidden=false;if(a.text)document.querySelector('#adText').textContent=a.text;if(a.imagePath){const img=document.querySelector('#adImage');img.src='/api?action=login-ad-image&v='+encodeURIComponent(a.updatedAt||'1');img.hidden=false}if(a.phone){const digits=String(a.phone).replace(/\\D/g,'');const normalized=digits.startsWith('0')?'967'+digits.slice(1):digits;const link=document.querySelector('#adWhats');link.href='https://wa.me/'+normalized;link.hidden=false}}catch(e){}}async function loadLoginAd(){try{const r=await fetch('/api?action=login-ad');if(!r.ok)return;const a=await r.json();if(!a.text&&!a.imagePath&&!a.phone)return;document.querySelector('#loginAd').hidden=false;document.querySelector('#adText').textContent=a.text||'';if(a.imagePath){const img=document.querySelector('#adImage');img.src='/api?action=login-ad-image';img.hidden=false}if(a.phone){const digits=String(a.phone).replace(/[^0-9]/g,'');const normalized=digits.startsWith('0')?'967'+digits.slice(1):digits;const link=document.querySelector('#adWhats');link.href='https://wa.me/'+normalized;link.hidden=false}}catch(e){}}loadLoginAd();document.querySelector('#login').onsubmit=async e=>{e.preventDefault();try{let f=Object.fromEntries(new FormData(e.target));let j=await post('login',f);if(j.user?.role==='admin'){await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'logout'})});msg.textContent='هذا دخول الإدارة. افتح رابط الإدارة: /admin.html';return}if(j.user?.role!=='merchant'){await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'logout'})});throw Error('هذه الصفحة مخصصة للتجار فقط')}location.href='/portal.html'}catch(x){msg.textContent=x.message}}</script></html>
