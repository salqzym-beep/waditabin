<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شبكة وادي تبن نت</title><style>*{box-sizing:border-box}body{margin:0;background:#07172d;color:#f4f8ff;font-family:Tahoma,Arial}.wrap{max-width:520px;margin:7vh auto;padding:18px}.card{background:#102947;border:1px solid #284866;border-radius:20px;padding:24px;box-shadow:0 16px 45px #0005}h1{font-size:25px;margin:0 0 8px;color:#75d9e7}p{color:#a9c1d2;line-height:1.8}input,select,button{width:100%;padding:13px;margin:7px 0;border-radius:11px;border:1px solid #31516f;background:#071a30;color:white;font-size:16px}button{background:linear-gradient(110deg,#1977ef,#13aeb8);border:0;font-weight:bold;cursor:pointer}.muted{font-size:13px;color:#91aabc}a{color:#8de5ed}</style><main class="wrap"><section class="card"><h1>شبكة وادي تبن نت</h1><p>بوابة العملاء والتجار — تسجيل الدخول أو إنشاء حساب جديد.</p><form id="login"><input name="username" placeholder="اسم المستخدم" required><input name="password" type="password" placeholder="كلمة المرور" required><button>دخول</button></form><hr style="border-color:#284866"><h3>إنشاء حساب</h3><form id="signup"><input name="name" placeholder="الاسم الكامل" required><input name="phone" placeholder="رقم الجوال" required><input name="username" placeholder="اسم المستخدم" required><input name="password" type="password" placeholder="كلمة المرور" required><select name="role"><option value="customer">عميل</option><option value="merchant">تاجر</option></select><label>سند الإيداع</label><input name="proof" type="file" accept="image/*,.pdf" required><button>إرسال طلب التسجيل</button></form><p class="muted">يتم تفعيل الحساب بعد مراجعة المدير والموافقة على الطلب.</p><p id="msg"></p></section></main><script>const msg=document.querySelector('#msg');async function post(action,data){let r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...data})});let j=await r.json();if(!r.ok)throw Error(j.error||'تعذر إتمام العملية');return j}document.querySelector('#login').onsubmit=async e=>{e.preventDefault();try{let f=Object.fromEntries(new FormData(e.target));let j=await post('login',f);location.href=j.user?.role==='admin'?'/admin.html':'/portal.html'}catch(x){msg.textContent=x.message}};document.querySelector('#signup').onsubmit=async e=>{e.preventDefault();try{let f=new FormData(e.target),file=f.get('proof');if(file.size>3*1024*1024)throw Error('حجم السند يتجاوز 3MB');let proofBase64=await new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=no;r.readAsDataURL(file)});await post('signup',{name:f.get('name'),phone:f.get('phone'),username:f.get('username'),password:f.get('password'),role:f.get('role'),proofBase64,proofName:file.name,proofType:file.type});msg.textContent='تم إرسال الطلب للمراجعة'}catch(x){msg.textContent=x.message}}</script></html>
